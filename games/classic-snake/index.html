<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>snake · mdjamin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="score-container">
      <div class="score">Score: <span class="score_val">0</span></div>
      <div class="high-score">High Score: <span class="high_score_val">0</span></div>
    </div>
    <div class="canvas-wrapper">
      <canvas width="400" height="400"></canvas>
    </div>
    <div class="controls">
      <button class="btn-start">Start</button>
      <button class="btn-pause">Pause</button>
      <div class="range range-difficulty">
        <label for="difficulty">Speed</label>
        <div class="range_inputWrapper">
          <span class="range_inputSlider"></span>
          <div class="range_inputValue"></div>
          <input type="range" name="difficulty" value="8" min="1" max="10" step="1" />
        </div>
      </div>
      <div class="range range-columns">
        <label for="columns">Cells</label>
        <div class="range_inputWrapper">
          <span class="range_inputSlider"></span>
          <div class="range_inputValue"></div>
          <input type="range" name="columns" value="20" min="10" max="100" step="10" />
        </div>
      </div>
    </div>
    <div class="mobile-controls">
      <div class="dpad">
        <button class="btn-left" aria-label="left">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="upAndDown">
          <button class="btn-up" aria-label="up">
            <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
          </button>
          <button class="btn-down" aria-label="down">
            <svg viewBox="0 0 24 24"><path d="M12 16l-6-6 1.41-1.41L12 13.17l4.59-4.58L18 10z"/></svg>
          </button>
        </div>
        <button class="btn-right" aria-label="right">
          <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="MDJAminDiv">
    <a class="MDJAmin" href="https://github.com/MDJAmin" target="_blank">MDJAmin</a>
  </div>
  <script src="js/script.js"></script>

  <script>
(function () {
    const username = localStorage.getItem("gamehub_username");

    if (!username) {
        console.log("GameHub: No logged-in user found. No reward given.");
        return;
    }

    const playerStats = JSON.parse(
        localStorage.getItem("gamehub_player_stats")
    ) || {};

    if (!playerStats[username]) {
        playerStats[username] = {
            played: 0,
            wins: 0,
            challenges: 0,
            xp: 0,
            money: 0
        };
    }

    const stats = playerStats[username];

    stats.played = stats.played || 0;
    stats.wins = stats.wins || 0;
    stats.challenges = stats.challenges || 0;
    stats.xp = stats.xp || 0;
    stats.money = stats.money || 0;

    const xpReward = Math.floor(Math.random() * 6) + 5;
    const moneyReward = Math.floor(Math.random() * 6) + 5;

    stats.played += 1;
    stats.xp += xpReward;
    stats.money += moneyReward;

    playerStats[username] = stats;

    localStorage.setItem(
        "gamehub_player_stats",
        JSON.stringify(playerStats)
    );

    window.dispatchEvent(new StorageEvent("storage", {
        key: "gamehub_player_stats",
        newValue: JSON.stringify(playerStats)
    }));

    console.log(
        `GameHub: +${xpReward} XP, +${moneyReward} Money, +1 Game Played`
    );
})();
</script>
</body>
</html>
