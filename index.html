<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .game-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            transform: scale(1.05);
            border-color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>Welcome to the Arcade</h1>
    <p>Select a game to play:</p>

    <div class="game-grid">
        <a href="games/tic-tac-toe/index.html" class="game-card">
            <h2>Tic-Tac-Toe</h2>
            <p>Classic 2-player game</p>
        </a>
        <a href="games/pong/index.html" class="game-card">
            <h2>Pong</h2>
            <p>Retro arcade action</p>
        </a>
    </div>

</body>
</html>
